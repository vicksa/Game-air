<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hand Quest — galeria de sprites</title><style>body{background:#10152d;color:#e7e4d9;font:14px monospace;margin:36px}h1{color:#ffc477}a{color:#8ce3ce}main{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px}.tile{border:1px solid #3a4460;padding:18px;background:#18213b}canvas{image-rendering:pixelated;display:block;width:144px;height:144px;margin:auto;background:repeating-conic-gradient(#26314a 0% 25%,#303950 0% 50%) 50%/16px 16px}.note{max-width:800px;line-height:1.8}button{background:#ffc477;border:0;padding:12px;cursor:pointer}</style><a href="./">← Voltar ao jogo</a><h1>ARQUIVO / SPRITES</h1><p class="note">Quatro personagens · sete estados · células 48 × 48 · pés alinhados. Arte original gerada pelo script do projeto. Use a pausa para conferir os quadros.</p><button id="toggle">PAUSAR ANIMAÇÕES</button><br><br><main id="gallery"></main><script type="module">
const atlas=await(await fetch('assets/atlas.json')).json();let paused=matchMedia('(prefers-reduced-motion: reduce)').matches;let t=0;const renderers=[];
for(const [kind,states]of Object.entries(atlas.animations)){const image=new Image();image.src=`assets/${kind}.png`;await image.decode();for(const[state,anim]of Object.entries(states)){const tile=document.createElement('section');tile.className='tile';const h=document.createElement('h3');h.textContent=`${kind.toUpperCase()} / ${state}`;const c=document.createElement('canvas');c.width=c.height=48;tile.append(h,c);document.querySelector('#gallery').append(tile);const ctx=c.getContext('2d');renderers.push(()=>{const f=anim.frames[Math.floor(t*anim.fps/1000)%anim.frames.length];ctx.clearRect(0,0,48,48);ctx.drawImage(image,f%6*48,Math.floor(f/6)*48,48,48,0,0,48,48);});}}
let last=performance.now();function tick(now){if(!paused)t+=now-last;last=now;renderers.forEach(r=>r());requestAnimationFrame(tick);}requestAnimationFrame(tick);const toggle=document.querySelector('#toggle');function label(){toggle.textContent=paused?'REPRODUZIR ANIMAÇÕES':'PAUSAR ANIMAÇÕES';}label();toggle.onclick=()=>{paused=!paused;label();};
</script></html>
